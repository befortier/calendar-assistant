name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-review:
    if: ${{ !contains(github.event.pull_request.title, '[no-review]') && !contains(github.event.pull_request.body, '[no-review]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: "--max-turns 20 --model ${{ github.event.pull_request.draft && 'claude-haiku-4-5-20251001' || 'claude-sonnet-4-6' }} --allowedTools Bash,Read,Glob,Grep"
          prompt: |
            You are reviewing a pull request. Do not explore the repository. Follow these steps in order without deviation:

            Step 1 — run exactly this command and nothing else first:
            gh pr diff ${{ github.event.pull_request.number }}

            Step 2 — review the diff output against the criteria below.

            Step 3 — run exactly this command to post your findings (required, do not skip):
            gh pr comment ${{ github.event.pull_request.number }} --body "<your review>"

            If you find issues, post them with file name, line number, the problematic code quoted, explanation, and suggested fix.
            If you find nothing, post: "✅ Code review complete — no issues found."

            ## React Best Practices
            - Unnecessary re-renders: missing `useMemo`, `useCallback`, `React.memo`
            - Incorrect or missing `useEffect` dependency arrays
            - Inline fetch calls in components instead of hooks
            - Prop drilling more than 2 levels deep

            ## Composition Patterns
            - Boolean prop proliferation — suggest variants or compound components
            - Components leaking domain logic
            - Context providers placed too high in the tree

            ## Web & Accessibility
            - Interactive elements missing accessible labels
            - Images missing `alt` text
            - Forms missing `<label>` elements

            ## General
            - TypeScript `any` types that could be tightened
            - Hardcoded strings that should be constants
            - Security issues (dangerouslySetInnerHTML, unsanitized input, exposed secrets)
